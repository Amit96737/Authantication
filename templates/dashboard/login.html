<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

    <div class="main_container">

        <div class="form-side" style="flex: 1; display: flex; align-items: center; justify-content: center;">
            <div class="signup-card" style="width: 100%; max-width: 420px; padding: 20px;">

                <h3 class="text-center mb-2 fw-bold">Login</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} p-2" style="font-size: 14px;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" class="login-form" novalidate>
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Email Address</label>
                        {{ form.email }}
                        <div class="text-danger" style="font-size: 13px;">{{ form.email.errors.as_text }}</div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        {{ form.password }}
                        <div class="text-danger" style="font-size: 13px;">{{ form.password.errors.as_text }}</div>
                    </div>

                    <div class="text-end mb-3">
                        <a href="{% url 'forgot_password' %}" class="text-decoration-none small text-secondary">Forgot Password ?</a>
                    </div>

                    <button type="submit" class="login-button mt-2">Login</button>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
