<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white" style="width: 100%; max-width: 420px;">

            <div class="logo-container" style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                    <div class="logo-circle" style="width: 150px; height: 150px; bg-color: #875a7b; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #8a5a7b;">
                        <img src="{% static 'images/odoo_logo.jfif' %}" alt="logo" style="width: 85%; height: auto; object-fit: contain;">
                    </div>
            </div>

            <h3 class="text-center mb-2 fw-bold text-dark">Enter OTP</h3>
            <p class="text-muted text-center small mb-4">We have sent a 6-digit verification code to <br><strong class="text-dark">{{ email }}</strong></p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} p-2" style="font-size: 14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" autocomplete="off" novalidate>
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold d-block text-center mb-3">6-Digit Code</label>

                    <div class="otp-container">
                        <input type="number" name="otp_1" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_2')" required autofocus>
                        <input type="number" name="otp_2" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_3')" onkeydown="moveToPrev(this, 'otp_1', event)" required>
                        <input type="number" name="otp_3" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_4')" onkeydown="moveToPrev(this, 'otp_2', event)" required>
                        <input type="number" name="otp_4" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_5')" onkeydown="moveToPrev(this, 'otp_3', event)" required>
                        <input type="number" name="otp_5" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_6')" onkeydown="moveToPrev(this, 'otp_4', event)" required>
                        <input type="number" name="otp_6" class="otp-input" maxlength="1" oninput="moveToNext(this, '')" onkeydown="moveToPrev(this, 'otp_5', event)" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm mb-3" style="background-color: #000; border: none;">Verify</button>
            </form>

        </div>
    </div>

    <script>
        function moveToNext(current, nextInputName) {
            if (current.value.length > 1) {
                current.value = current.value.slice(0, 1);
            }
            if (current.value.length >= 1) {
                if (nextInputName !== '') {
                    document.getElementsByName(nextInputName)[0].focus();
                }
            }
        }

        function moveToPrev(current, prevInputName, event) {
            if (event.key === "Backspace" && current.value.length === 0) {
                if (prevInputName !== '') {
                    document.getElementsByName(prevInputName)[0].focus();
                }
            }
        }
    </script>
</body>
</html>
