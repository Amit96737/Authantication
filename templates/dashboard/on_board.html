<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Packages</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container py-5">
    <div class="border-bottom pb-3 mb-5 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h1 class="fw-bold text-dark m-0 display-6">Subscription Plans</h1>
    </div>

    <div class="row g-4 justify-content-center align-items-stretch">
        {% for plan in plans %}
        <div class="col-12 col-md-6 col-lg-4 d-flex">
            <div class="card border-0 shadow-sm rounded-3 text-center bg-white w-100 d-flex flex-column custom-pricing-card">

                <div class="py-4 text-white fw-bold bg-dark">
                    {{ plan.title }}
                </div>

                <div class="py-4 border-bottom">
                    <h2 class="fw-bold m-0">
                        ₹{{ plan.price }}
                    </h2>
                    <span class="text-secondary small">{{ plan.validity }}</span>
                </div>

                <div class="p-4 flex-grow-1">
                    <div class="bg-light p-2 rounded small text-secondary">
                        {{ plan.description|truncatechars:200 }}
                    </div>
                </div>

                <div class="p-4">
                    <a href="{% url 'initiate_paypal_payment' plan.id %}" class="btn btn-dark w-100 fw-bold">
                        Buy
                    </a>
                </div>

            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-muted">No plans available</p>
        </div>
        {% endfor %}
    </div>
</div>

<style>
.custom-pricing-card {
    transition: 0.3s;
}
.custom-pricing-card:hover {
    transform: translateY(-5px);
}
</style>

</body>
</html>
