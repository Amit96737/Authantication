<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Verify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="main_container">

        <div class="form-side" style="flex: 1; display: flex; align-items: center; justify-content: center;">
            <div class="signup-card" style="width: 100%; max-width: 420px; padding: 20px;">
                <h3 class="text-center mb-2 fw-bold">Verify Mobile</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} p-2 text-center" style="font-size: 14px;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" autocomplete="off" novalidate>
                    {% csrf_token %}
                    <div class="form-group text-center">
                        <label class="fw-bold mb-2">Enter Mobile OTP</label>
                        <div class="otp-container">
                            <input type="number" name="otp_1" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_2')" required autofocus>
                            <input type="number" name="otp_2" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_3')" onkeydown="moveToPrev(this, 'otp_1')" required>
                            <input type="number" name="otp_3" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_4')" onkeydown="moveToPrev(this, 'otp_2')" required>
                            <input type="number" name="otp_4" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_5')" onkeydown="moveToPrev(this, 'otp_3')" required>
                            <input type="number" name="otp_5" class="otp-input" maxlength="1" oninput="moveToNext(this, 'otp_6')" onkeydown="moveToPrev(this, 'otp_4')" required>
                            <input type="number" name="otp_6" class="otp-input" maxlength="1" oninput="moveToNext(this, '')" onkeydown="moveToPrev(this, 'otp_5')" required>
                        </div>
                    </div>
                    <button type="submit" class="login-button mt-2">Verify & Register</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function moveToNext(current, nextInputName) { if (current.value.length >= 1 && nextInputName !== '') { document.getElementsByName(nextInputName)[0].focus(); } }
        function moveToPrev(current, prevInputName) { if (event.key === "Backspace" && current.value.length === 0 && prevInputName !== '') { document.getElementsByName(prevInputName)[0].focus(); } }
    </script>
</body>
</html>
