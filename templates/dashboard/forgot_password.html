<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white" style="width: 100%; max-width: 420px;">

            <h3 class="text-center mb-2 fw-bold text-dark">Reset Password</h3>
            <p class="text-muted text-center small mb-4">Enter your registered email to receive a OTP.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} p-2" style="font-size: 14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'forgot_password' %}" novalidate>
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Email</label>
                    <input type="email" name="email" class="form-control py-2" placeholder="name@example.com" required style="border-radius: 0.375rem;">
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm mb-3" style="background-color: #000; border: none;">Send OTP</button>

                <div class="text-center">
                    <a href="{% url 'user_login' %}" class="text-decoration-none small text-secondary">Back to Login</a>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
