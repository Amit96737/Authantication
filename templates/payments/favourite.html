{% extends "base.html" %}

{% block title %}My Favourite{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <a href="{% url 'item_detail' %}" class="btn btn-outline-dark rounded-3 px-3">
        ← Back
    </a>

</div>

<div class="container mb-4">
    <form method="GET" class="d-flex w-100">

        <input type="text" name="q" value="{{ request.GET.q }}"
               class="form-control rounded-3 me-2"
               placeholder="Search......">

        <button type="submit" class="btn btn-dark rounded-3 px-4">
            <i class="fa fa-search"></i>
        </button>

    </form>
</div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-5">
        <h2 class="fw-bold m-0">My Favourite Items</h2>
    </div>

    <div class="row">

{% for fav in fav_items %}
<div class="col-12 mb-3">

    <div class="card shadow-sm border-0 rounded-3 p-3 cart-card">

        <div class="row align-items-center">

            <div class="col-3 text-center">
                <img src="{{ fav.item.image.url }}"
                     class="img-fluid rounded"
                     style="height: 100px; object-fit: cover;">
            </div>

            <div class="col-6">
                <h6 class="fw-bold mb-1">{{ fav.item.title }}</h6>
                <p class="text-muted small mb-1">{{ fav.item.brand }}</p>

                <span class="fw-bold text-dark">
                    ₹{{ fav.item.price }}
                </span>

                <p class="mb-0 small">
                    Qty: {{ fav.quantity }}
                </p>
            </div>

            <div class="col-3 text-end">
                <a href="{% url 'delete_favourite_item' fav.id %}"
                   class="btn btn-outline-danger btn-sm">
                    Remove
                </a>
            </div>

        </div>

    </div>

</div>
{% endfor %}

</div>

</div>

{% endblock %}
