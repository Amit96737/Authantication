{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'dashboard' %}" class="btn btn-outline-dark rounded-3 px-3">
        ← Back to Dashboard
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <h4 class="text-center mb-4 fw-bold">
                    Salary Predictor
                </h4>

                <form method="POST" action="{% url 'predict_salary' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" name="age" class="form-control" min="18" max="65" required>
                    </div>

                    <div class="mb-3">
                        <label>Job Title</label>
                        <select name="job" class="form-control">
                            {% for job in jobs %}
                                <option value="{{ job }}">{{ job }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Experience</label>
                        <input type="number" step="0.1" name="experience" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Education</label>
                        <select name="education" class="form-control">
                            {% for edu in educations %}
                                <option value="{{ edu }}">{{ edu }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Predict Salary
                    </button>
                    <a href="upi://pay?pa=rishavdeep785@okicici&pn=Rishav%20Deep">
                        Pay Now
                    </a>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
