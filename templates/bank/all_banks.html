{% extends "base.html" %}

{% block title %}All Bank Records{% endblock %}

{% block content %}
<div class="mb-4">
        <a href="{% url 'create_bank' %}" class="btn btn-outline-dark rounded-3 px-3">
            ← Back
        </a>
    </div>
<div class="container-fluid py-4 px-4">
    
    <div class="border-bottom pb-3 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h1 class="fw-bold text-dark m-0 display-6">All Bank List</h1>
        <a href="{% url 'create_bank' %}" class="btn btn-outline-dark fw-bold btn-sm rounded-3 px-3 shadow-sm">
            <i class="fa-solid fa-user-plus me-1"></i> Add New Bank
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0" style="font-size: 14px;">
                <thead class="table-dark">
                    <tr>
                        <th class="py-3">S.No</th>
                        <th class="py-3">Name</th>
                        <th class="py-3">IFSC Code</th>
                    </tr>
                </thead>
                <tbody>
                    {% for banks in all_banks %}
                    <tr>
                        <td class="text-dark fw-bold">{{ forloop.counter }}</td>
                        <td class="text-dark fw-bold">{{ banks.name }}</td>
                        <td class="font-monospace text-secondary">{{ banks.ifsc_code }}</td>

                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted font-monospace">
                            <i class="fa-solid fa-folder-open d-block display-6 mb-3 text-secondary"></i>
                            No records found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
