{% extends "base.html" %}

{% block title %}PayPal Management{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="mb-4">
        <a href="{% url 'sub_admin_dashboard' %}" class="btn btn-outline-dark rounded-3 px-3">
            ← Back to Dashboard
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="fw-bold text-dark mb-0">PayPal Management Section</h2>

    <form method="GET" class="d-flex" style="width: 300px;">
        <input type="text" name="q" value="{{ request.GET.q }}"
               class="form-control rounded-3 me-2"
               placeholder="Search subscriptions...">

        <button type="submit" class="btn btn-dark rounded-3 px-3">
            <i class="fa fa-search"></i>
        </button>
    </form>

    </div>

</div>

{% endblock %}
