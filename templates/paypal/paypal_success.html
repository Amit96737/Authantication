{% extends "base.html" %}

{% block title %}Payment Success{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm p-5 border-0 rounded-4 mx-auto" style="max-width: 600px;">

        <h1 class="text-success fw-bold mb-3">✅ Payment Successful</h1>

        <p class="text-muted mb-2">
            Thank you, <strong>{{ payer_name }}</strong>! Your subscription payment has been completed successfully.
        </p>
        <p class="font-monospace text-secondary small mb-4">
            Reference ID: {{ order_id }}
        </p>

        <a href="{% url 'plan_page' %}" class="btn btn-dark rounded-3 px-4 py-2 fw-bold shadow-sm">
            Continue to Plans
        </a>

    </div>
</div>
{% endblock %}
