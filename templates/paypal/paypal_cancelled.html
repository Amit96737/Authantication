{% extends "base.html" %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm p-5 border-0 rounded-4 mx-auto" style="max-width: 600px;">

        <h1 class="text-danger fw-bold mb-3">❌ Payment Cancelled</h1>

        <p class="text-muted mb-4">
            Your PayPal payment process was cancelled or closed. No charges were applied. You can try again anytime.
        </p>

        <a href="{% url 'plan_page' %}" class="btn btn-outline-dark rounded-3 px-4 py-2 fw-bold">
            Back to Subscription Plans
        </a>

    </div>
</div>
{% endblock %}
